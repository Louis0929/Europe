<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴黎聖誕浪漫之旅</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --french-blue: #002654;
            --french-white: #FFFFFF;
            --french-red: #CE1126;
            --gold: #D4AF37;
            --cream: #FDF8F3;
            --text-dark: #1a1a2e;
            --text-muted: #6b7280;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--cream); 
            color: var(--text-dark); 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
        }
        
        /* ===== 頂部導航 (法國風格) ===== */
        header { 
            background: linear-gradient(135deg, var(--french-blue) 0%, #0a1628 100%);
            color: white; 
            padding: 20px 24px; 
            text-align: center; 
            position: relative;
            overflow: hidden;
        }

        /* 法國三色旗頂部邊框 */
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--french-blue) 33%, var(--french-white) 33% 66%, var(--french-red) 66%);
        }

        /* 鐵塔裝飾 */
        .eiffel-deco {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            opacity: 0.15;
        }
        .eiffel-deco-left {
            left: 20px;
            right: auto;
        }

        header h1 { 
            margin: 0; 
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem; 
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        header h1 span { color: var(--gold); }
        header p { 
            margin: 8px 0 0; 
            font-size: 0.85rem; 
            opacity: 0.85;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        header p::before, header p::after {
            content: '✦';
            color: var(--gold);
            font-size: 0.6rem;
        }

        /* ===== 日期選擇器 ===== */
        .day-selector { 
            display: flex; 
            overflow-x: auto; 
            background: white; 
            padding: 14px 20px; 
            gap: 12px; 
            border-bottom: 1px solid #e5e7eb;
            scrollbar-width: none;
        }
        .day-selector::-webkit-scrollbar { display: none; }

        .day-btn { 
            flex: 0 0 auto; 
            padding: 10px 20px; 
            border: 2px solid #e5e7eb; 
            border-radius: 25px; 
            background: white; 
            cursor: pointer; 
            font-size: 0.9rem; 
            font-weight: 500;
            transition: all 0.3s ease; 
            white-space: nowrap; 
            color: var(--text-dark);
            font-family: inherit;
        }
        .day-btn:hover { 
            border-color: var(--french-blue);
            background: #f8fafc;
        }
        .day-btn.active { 
            background: var(--french-blue); 
            color: white; 
            border-color: var(--french-blue);
            box-shadow: 0 4px 12px rgba(0, 38, 84, 0.25);
        }

        /* ===== 主內容區 ===== */
        .container { display: flex; flex: 1; overflow: hidden; }
        
        /* ===== 左側行程列表 ===== */
        .sidebar { 
            width: 420px; 
            overflow-y: auto; 
            background: linear-gradient(180deg, #fefefe 0%, var(--cream) 100%);
            padding: 24px; 
            border-right: 1px solid #e5e7eb;
        }
        
        .day-header { 
            padding-bottom: 16px; 
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gold);
            position: relative;
        }
        .day-header::after {
            content: '⚜';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--cream);
            padding: 0 10px;
            color: var(--gold);
            font-size: 1rem;
        }
        .day-header h2 { 
            margin: 0; 
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem; 
            color: var(--french-blue);
            font-weight: 700;
        }
        .day-header span { 
            font-size: 0.95rem; 
            color: var(--text-muted);
            display: block;
            margin-top: 4px;
        }

        /* 時間軸容器 */
        .timeline-wrapper { 
            position: relative; 
            padding-left: 50px;
            margin-bottom: 8px;
        }
        .timeline-wrapper::before { 
            content: ''; 
            position: absolute; 
            left: 18px; 
            top: 40px; 
            bottom: -12px; 
            width: 2px; 
            background: linear-gradient(180deg, var(--gold) 0%, #e5e7eb 100%);
        }
        .timeline-wrapper:last-child::before { display: none; }
        
        /* 序號圓點 */
        .step-number { 
            position: absolute; 
            left: 0; 
            top: 16px; 
            width: 38px; 
            height: 38px; 
            background: linear-gradient(135deg, var(--french-blue) 0%, #1a365d 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 3px 8px rgba(0, 38, 84, 0.3);
            z-index: 2;
        }

        .timeline-item { 
            background: white;
            border-radius: 16px; 
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #f1f5f9;
            transition: all 0.3s ease;
        }
        .timeline-item:hover { 
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border-color: var(--gold);
        }
        
        .time-badge { 
            display: inline-block; 
            background: linear-gradient(135deg, var(--french-red) 0%, #b91c1c 100%);
            color: white;
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .location-title { 
            font-size: 1.15rem; 
            font-weight: 700; 
            margin: 0 0 8px 0; 
            color: var(--text-dark);
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 10px;
        }
        .desc { 
            font-size: 0.9rem; 
            color: var(--text-muted); 
            line-height: 1.6;
        }
        
        .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
        .tag { 
            font-size: 0.7rem; 
            padding: 3px 10px; 
            border-radius: 12px; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tag.transport { background: #dbeafe; color: #1e40af; }
        .tag.logistic { background: #f3e8ff; color: #7c3aed; }
        .tag.visit { background: #fef3c7; color: #b45309; }
        .tag.highlight { background: #fce7f3; color: #be185d; }
        .tag.food { background: #fed7aa; color: #c2410c; }
        .tag.rest { background: #d1fae5; color: #047857; }
        .tag.shopping { background: #cffafe; color: #0e7490; }
        .tag.photo { background: #ede9fe; color: #6d28d9; }

        /* 交通資訊 */
        .transit-info {
            margin-top: 14px;
            padding: 12px 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 10px;
            border-left: 3px solid var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .transit-icon { font-size: 1.2rem; }
        
        /* Google Maps 按鈕 */
        .maps-btn {
            text-decoration: none; 
            background: white;
            color: var(--french-blue);
            border: 1.5px solid var(--french-blue);
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px;
            font-weight: 600;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .maps-btn:hover { 
            background: var(--french-blue); 
            color: white;
        }

        /* ===== 右側地圖 ===== */
        #map { flex: 1; height: 100%; }

        /* 地圖標記樣式 */
        .numbered-marker {
            background: linear-gradient(135deg, var(--french-blue) 0%, #1a365d 100%);
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            font-family: 'Noto Sans TC', sans-serif;
        }
        .numbered-marker.home-marker {
            background: linear-gradient(135deg, var(--french-red) 0%, #991b1b 100%);
            width: 36px;
            height: 36px;
            font-size: 18px;
        }

        /* Leaflet Popup 樣式 */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .leaflet-popup-content {
            margin: 12px 16px;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .popup-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--french-blue);
            margin-bottom: 4px;
        }
        .popup-time {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .popup-number {
            display: inline-block;
            background: var(--french-blue);
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-right: 6px;
        }

        /* ===== 響應式設計 ===== */
        @media (max-width: 900px) {
            .container { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 55%; }
            #map { height: 45%; }
            .eiffel-deco { display: none; }
            header h1 { font-size: 1.3rem; }
        }

        /* 聖誕裝飾動畫 */
        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .christmas-star {
            animation: twinkle 2s ease-in-out infinite;
        }
    </style>
</head>
<body>

<header>
    <span class="eiffel-deco eiffel-deco-left">🗼</span>
    <span class="eiffel-deco">🗼</span>
    <h1>🎄 <span>Paris</span> 聖誕之旅</h1>

        {

            steps: [
                { 
                    time: "09:00", loc: "gare_nord", name: "出發", desc: "步行至北站搭 RER B 轉 A", type: "transport",

                },
                {

                {

                }
            ]

        {

    // 初始化地圖
    let map = L.map('map').setView([48.8566, 2.3522], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
    }).addTo(map);

    let markers = [];
    let currentPolyline = null;

    // 創建數字標記
    function createNumberedIcon(number, isHome = false) {
        return L.divIcon({
            className: 'custom-marker',
            html: `<div class="numbered-marker ${isHome ? 'home-marker' : ''}">${isHome ? '🏠' : number}</div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });
    }

    function renderDaySelector() {
        const container = document.getElementById('daySelector');
        itinerary.forEach((day, index) => {
            const btn = document.createElement('button');
            btn.className = `day-btn ${index === 0 ? 'active' : ''}`;
            btn.innerHTML = `<span style="font-weight:700">Day ${day.day}</span> · ${day.date}`;
            btn.onclick = () => loadDay(index);
            container.appendChild(btn);
        });
    }

    function loadDay(index) {
        // Update Buttons
        document.querySelectorAll('.day-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });

        // Update Timeline
        const dayData = itinerary[index];
        const timeline = document.getElementById('timeline');
        timeline.innerHTML = `
            <div class="day-header">
                <h2>${dayData.title}</h2>
                <span>${dayData.fullDate}</span>
            </div>
        `;

        // Map updates
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        if (currentPolyline) map.removeLayer(currentPolyline);

        const latlngs = [];
        let stepNum = 1;

        dayData.steps.forEach((step, idx) => {
            const locData = locations[step.loc] || {};
            const googleMapUrl = locData.lat ? `https://www.google.com/maps/search/?api=1&query=${locData.lat},${locData.lng}` : '#';
            const isHome = step.loc === 'home';

            // Render Timeline Item
            const wrapper = document.createElement('div');
            wrapper.className = 'timeline-wrapper';

            let transitHtml = '';
            if (step.transit) {
                transitHtml = `
                    <div class="transit-info">
                        <span class="transit-icon">↓</span>
                        <div style="flex:1">${step.transit.mode}</div>
                        <div style="font-weight:700; color:#002654;">${step.transit.time}</div>
                    </div>
                `;
            }

            wrapper.innerHTML = `
                <div class="step-number">${isHome ? '🏠' : stepNum}</div>
                <div class="timeline-item">
                    <span class="time-badge">${step.time}</span>
                    <div class="location-title">
                        <span>${step.name}</span>
                        ${locData.lat ? `<a href="${googleMapUrl}" target="_blank" class="maps-btn">📍 導航</a>` : ''}
                    </div>
                    <div class="desc">${step.desc}</div>
                    <div class="tags">
                        <span class="tag ${step.type}">${step.type.toUpperCase()}</span>
                    </div>
                    ${transitHtml}
                </div>
            `;
            timeline.appendChild(wrapper);

            // Add Map Marker
            if (locData.lat) {
                const marker = L.marker([locData.lat, locData.lng], {
                    icon: createNumberedIcon(stepNum, isHome)
                }).bindPopup(`
                    <div class="popup-title">
                        <span class="popup-number">${isHome ? '🏠' : stepNum}</span>
                        ${step.name}
                    </div>
                    <div class="popup-time">${step.time} · ${step.desc}</div>
                `).addTo(map);
                
                markers.push(marker);
                latlngs.push([locData.lat, locData.lng]);
            }

            if (!isHome || idx === 0) stepNum++;
        });

        // Fit map bounds and draw route
        if (latlngs.length > 0) {
            const bounds = L.latLngBounds(latlngs);
            map.fitBounds(bounds, { padding: [60, 60] });
            
            // Draw animated route line
            currentPolyline = L.polyline(latlngs, {
                color: '#002654',
                weight: 3,
                opacity: 0.7,
                dashArray: '8, 12',
                lineCap: 'round'
            }).addTo(map);

            // Add arrow decorations
            const arrowHead = L.polylineDecorator ? L.polylineDecorator(currentPolyline, {
                patterns: [
                    {offset: '50%', repeat: 100, symbol: L.Symbol.arrowHead({pixelSize: 10, polygon: false, pathOptions: {stroke: true, color: '#D4AF37', weight: 2}})}
                ]
            }).addTo(map) : null;
        }
    }

    // Initialize
    renderDaySelector();
    loadDay(0);
</script>
</body>
</html>
