<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴黎聖誕之旅 | Europe Trip 2024</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { display: flex; flex-direction: column; height: 100vh; }
        .back-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            text-decoration: none;
            color: white;
            opacity: 0.8;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .back-btn:hover { opacity: 1; }
        .eiffel-deco {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            opacity: 0.15;
        }
        @media (max-width: 900px) {
            .back-btn { position: static; transform: none; margin-bottom: 10px; }
            .eiffel-deco { display: none; }
        }
    </style>
</head>
<body>

<header class="france">
    <a href="../index.html" class="back-btn">← 返回首頁</a>
    <span class="eiffel-deco">🗼</span>
    <h1>🎄 <span>Paris</span> 聖誕之旅</h1>
    <p>Dec 24-29 · 165 Rue du Faubourg Poissonnière (9ème)</p>
</header>

<div class="day-selector france" id="daySelector"></div>

<div class="container">
    <div class="sidebar" id="timeline"></div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 住宿座標
    const home = { lat: 48.8812856, lng: 2.3496956, title: "🏠 溫暖的家 (Airbnb)" };
    
    // 景點座標數據
    const locations = {
        cdg: { lat: 49.0097, lng: 2.5479, title: "戴高樂機場 (CDG)" },
        gare_nord: { lat: 48.8809, lng: 2.3561, title: "Gare du Nord (北站)" },
        sacre_coeur: { lat: 48.8867, lng: 2.3431, title: "聖心堂" },
        wall_love: { lat: 48.8848, lng: 2.3385, title: "愛牆" },
        notre_dame_market: { lat: 48.8521, lng: 2.3476, title: "聖母院聖誕市集" },
        disney: { lat: 48.8674, lng: 2.7836, title: "迪士尼樂園" },
        versailles: { lat: 48.8049, lng: 2.1204, title: "凡爾賽宮" },
        invalides: { lat: 48.8565, lng: 2.3127, title: "榮軍院" },
        alexandre_bridge: { lat: 48.8639, lng: 2.3136, title: "亞歷山大三世橋" },
        arc_triomphe: { lat: 48.8738, lng: 2.2950, title: "凱旋門" },
        louvre: { lat: 48.8606, lng: 2.3376, title: "羅浮宮" },
        orangerie: { lat: 48.8638, lng: 2.3227, title: "橘園美術館" },
        lafayette: { lat: 48.8736, lng: 2.3321, title: "老佛爺百貨" },
        eiffel: { lat: 48.8584, lng: 2.2945, title: "艾菲爾鐵塔" },
        marais: { lat: 48.8576, lng: 2.3592, title: "瑪黑區" },
        boat: { lat: 48.8618, lng: 2.2962, title: "遊船碼頭" },
        chartier: { lat: 48.8719, lng: 2.3431, title: "Bouillon Chartier" },
        gare_lyon: { lat: 48.8443, lng: 2.3744, title: "Gare de Lyon" },
        bercy_museum: { lat: 48.8333, lng: 2.3879, title: "遊樂園博物館" },
        montaigne_ave: { lat: 48.8660, lng: 2.3040, title: "蒙田大道" },
        alma_bridge: { lat: 48.8638, lng: 2.3021, title: "阿爾瑪橋" },
        home: home
    };

    // 行程數據
    const itinerary = [
        {
            day: 1, date: "12月24", fullDate: "12/24 (二) 平安夜", title: "蒙馬特與聖誕市集",
            steps: [
                { time: "06:10", loc: "cdg", name: "抵達機場", desc: "前往北站寄放行李 (RER B)", type: "transport" },
                { 
                    time: "08:30", loc: "gare_nord", name: "北站寄行李", desc: "Gare du Nord Consignes", type: "logistic",
                    transit: { time: "40分鐘", mode: "🚆 RER B" }
                },
                { 
                    time: "09:30", loc: "sacre_coeur", name: "蒙馬特高地", desc: "聖心堂、愛牆、Pigalle 球場", type: "visit",
                    transit: { time: "20分鐘", mode: "🚇 地鐵 4/12 號線" }
                },
                { 
                    time: "14:30", loc: "gare_nord", name: "取回行李", desc: "步行回 Airbnb", type: "logistic",
                    transit: { time: "20分鐘", mode: "🚌 巴士/步行" }
                },
                { 
                    time: "16:00", loc: "home", name: "Check-in 補眠", desc: "165 Rue du Faubourg Poissonnière", type: "rest",
                    transit: { time: "10分鐘", mode: "🚶 步行" }
                },
                { 
                    time: "19:00", loc: "notre_dame_market", name: "聖母院聖誕市集", desc: "最後機會！喝熱紅酒 🍷", type: "highlight",
                    transit: { time: "25分鐘", mode: "🚇 地鐵 7 號線" }
                }
            ]
        },
        {
            day: 2, date: "12月25", fullDate: "12/25 (三) 聖誕節", title: "迪士尼魔法日",
            steps: [
                { 
                    time: "09:00", loc: "gare_nord", name: "出發", desc: "步行至北站搭 RER B 轉 A", type: "transport",
                    transit: { time: "10分鐘", mode: "🚶 步行至北站" }
                },
                { 
                    time: "10:30", loc: "disney", name: "Disneyland Paris", desc: "全日遊玩，看煙花 🎆 <a href='disney-guide.html' style='color:#FF69B4;font-weight:bold;'>📖 睇攻略</a>", type: "highlight",
                    transit: { time: "50分鐘", mode: "🚆 RER A (米奇列車)" }
                },
                { 
                    time: "22:00", loc: "home", name: "回程", desc: "返回溫暖的家", type: "rest",
                    transit: { time: "60分鐘", mode: "🚆 RER A 轉地鐵" }
                }
            ]
        },
        {
            day: 3, date: "12月26", fullDate: "12/26 (四)", title: "凡爾賽與香榭麗舍",
            steps: [
                { 
                    time: "10:15", loc: "gare_nord", name: "出發", desc: "RER B 轉 C 線", type: "transport",
                    transit: { time: "10分鐘", mode: "🚶 步行前往" }
                },
                { 
                    time: "11:30", loc: "versailles", name: "凡爾賽宮", desc: "已預約 11:30。鏡廳、花園 👑", type: "highlight",
                    transit: { time: "45分鐘", mode: "🚆 RER C" }
                },
                { 
                    time: "15:45", loc: "invalides", name: "榮軍院", desc: "拿破崙墓、大炮", type: "visit",
                    transit: { time: "30分鐘", mode: "🚆 RER C" }
                },
                { 
                    time: "18:00", loc: "alexandre_bridge", name: "亞歷山大三世橋", desc: "日落打卡，看鐵塔亮燈 🌅", type: "photo",
                    transit: { time: "5分鐘", mode: "🚶 步行" }
                },
                { 
                    time: "19:30", loc: "arc_triomphe", name: "香榭麗舍/凱旋門", desc: "晚餐與漫步", type: "visit",
                    transit: { time: "20分鐘", mode: "🚌 地鐵/巴士" }
                }
            ]
        },
        {
            day: 4, date: "12月27", fullDate: "12/27 (五)", title: "藝術與浪漫之夜",
            steps: [
                { 
                    time: "08:30", loc: "home", name: "出發", desc: "步行至 Poissonnière 搭 7 號線直達", type: "transport" 
                },
                { 
                    time: "09:00", loc: "louvre", name: "羅浮宮", desc: "已預約 09:00。蒙娜麗莎、勝利女神 🎨", type: "highlight",
                    transit: { time: "20分鐘", mode: "🚇 地鐵 7 號線" }
                },
                { 
                    time: "14:30", loc: "orangerie", name: "橘園美術館", desc: "莫奈睡蓮 🪷 沉浸式體驗", type: "visit",
                    transit: { time: "10分鐘", mode: "🚶 步行經過杜樂麗花園" }
                },
                {
                    time: "17:00", loc: "montaigne_ave", name: "蒙田大道", desc: "天黑時刻！聖誕燈飾最美 ✨", type: "highlight",
                    transit: { time: "20分鐘", mode: "🚇 地鐵 1 號線" }
                },
                {
                    time: "18:00", loc: "boat", name: "塞納河遊船", desc: "Bateaux Parisiens 夜景超正！", type: "highlight",
                    transit: { time: "5分鐘", mode: "🚶 步行至碼頭" }
                },
                {
                    time: "20:00", loc: "eiffel", name: "鐵塔附近晚餐", desc: "看鐵塔整點閃燈 ✨", type: "food",
                    transit: { time: "10分鐘", mode: "🚶 步行" }
                }
            ]
        },
        {
            day: 5, date: "12月28", fullDate: "12/28 (六)", title: "復古遊樂園 & 終極購物",
            steps: [
                {
                    time: "10:00", loc: "bercy_museum", name: "遊樂園博物館", desc: "Musée des Arts Forains 復古遊樂場！🎠", type: "highlight",
                    transit: { time: "25分鐘", mode: "🚇 地鐵 14 號線" }
                },
                {
                    time: "13:00", loc: "marais", name: "瑪黑區", desc: "Supreme / Kith 潮牌掃貨，慢慢行", type: "shopping",
                    transit: { time: "20分鐘", mode: "🚇 地鐵 1 號線" }
                },
                {
                    time: "16:30", loc: "lafayette", name: "老佛爺百貨", desc: "週日營業 11:00-20:00，穹頂必睇！", type: "shopping",
                    transit: { time: "15分鐘", mode: "🚇 地鐵 8 號線" }
                },
                {
                    time: "19:00", loc: "chartier", name: "Bouillon Chartier", desc: "百年平價法餐，完美收尾！🍽️", type: "food",
                    transit: { time: "10分鐘", mode: "🚶 步行回第9區" }
                }
            ]
        },
        {
            day: 6, date: "12月29", fullDate: "12/29 (日)", title: "告別巴黎",
            steps: [
                {
                    time: "10:00", loc: "home", name: "Check-out", desc: "收拾行李，最後確認", type: "logistic"
                },
                {
                    time: "11:30", loc: "gare_lyon", name: "Gare de Lyon", desc: "搭火車前往瑞士 🇨🇭", type: "transport",
                    transit: { time: "25分鐘", mode: "🚇 地鐵 7 號線轉 14 號線" }
                }
            ]
        }
    ];

    // 初始化地圖
    let map = L.map('map').setView([48.8566, 2.3522], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
    }).addTo(map);

    let markers = [];
    let currentPolyline = null;

    // 創建數字標記
    function createNumberedIcon(number, isHome = false) {
        return L.divIcon({
            className: 'custom-marker',
            html: `<div class="numbered-marker ${isHome ? 'home-marker' : ''}">${isHome ? '🏠' : number}</div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });
    }

    function renderDaySelector() {
        const container = document.getElementById('daySelector');
        itinerary.forEach((day, index) => {
            const btn = document.createElement('button');
            btn.className = `day-btn ${index === 0 ? 'active' : ''}`;
            btn.innerHTML = `<span style="font-weight:700">Day ${day.day}</span> · ${day.date}`;
            btn.onclick = () => loadDay(index);
            container.appendChild(btn);
        });
    }

    function loadDay(index) {
        // Update Buttons
        document.querySelectorAll('.day-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });

        // Update Timeline
        const dayData = itinerary[index];
        const timeline = document.getElementById('timeline');
        timeline.innerHTML = `
            <div class="day-header">
                <h2>${dayData.title}</h2>
                <span>${dayData.fullDate}</span>
            </div>
        `;

        // Map updates
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        if (currentPolyline) map.removeLayer(currentPolyline);

        const latlngs = [];
        let stepNum = 1;

        dayData.steps.forEach((step, idx) => {
            const locData = locations[step.loc] || {};
            const googleMapUrl = locData.lat ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(locData.title + ', Paris, France')}` : '#';
            const isHome = step.loc === 'home';

            // Render Timeline Item
            const wrapper = document.createElement('div');
            wrapper.className = 'timeline-wrapper';

            let transitHtml = '';
            if (step.transit) {
                transitHtml = `
                    <div class="transit-info">
                        <span class="transit-icon">↓</span>
                        <div style="flex:1">${step.transit.mode}</div>
                        <div style="font-weight:700; color:#002654;">${step.transit.time}</div>
                    </div>
                `;
            }

            wrapper.innerHTML = `
                <div class="step-number">${isHome ? '🏠' : stepNum}</div>
                <div class="timeline-item">
                    <span class="time-badge">${step.time}</span>
                    <div class="location-title">
                        <span>${step.name}</span>
                        ${locData.lat ? `<a href="${googleMapUrl}" target="_blank" class="maps-btn">📍 導航</a>` : ''}
                    </div>
                    <div class="desc">${step.desc}</div>
                    <div class="tags">
                        <span class="tag ${step.type}">${step.type.toUpperCase()}</span>
                    </div>
                    ${transitHtml}
                </div>
            `;
            timeline.appendChild(wrapper);

            // Add Map Marker
            if (locData.lat) {
                const marker = L.marker([locData.lat, locData.lng], {
                    icon: createNumberedIcon(stepNum, isHome)
                }).bindPopup(`
                    <div class="popup-title">
                        <span class="popup-number">${isHome ? '🏠' : stepNum}</span>
                        ${step.name}
                    </div>
                    <div class="popup-time">${step.time} · ${step.desc}</div>
                `).addTo(map);
                
                markers.push(marker);
                latlngs.push([locData.lat, locData.lng]);
            }

            if (!isHome || idx === 0) stepNum++;
        });

        // Fit map bounds and draw route
        if (latlngs.length > 0) {
            const bounds = L.latLngBounds(latlngs);
            map.fitBounds(bounds, { padding: [60, 60] });
            
            // Draw route line
            currentPolyline = L.polyline(latlngs, {
                color: '#002654',
                weight: 3,
                opacity: 0.7,
                dashArray: '8, 12',
                lineCap: 'round'
            }).addTo(map);
        }
    }

    // Initialize
    renderDaySelector();
    loadDay(0);
</script>
</body>
</html>
